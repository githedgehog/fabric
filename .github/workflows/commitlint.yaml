# Make sure commit subject and description follow the Conventional Commits spec.
# See https://www.conventionalcommits.org/

name: "commitlint"

on:
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: lab
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
          persist-credentials: "false"

      - name: Run commitlint on Pull Request's commits
        uses: opensource-nepal/commitlint@v2
        with:
          verbose: true

      - name: Block Merge Commits
        if: ${{ always() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # needs full history (fetch-depth: 0 above); rev-list fails loudly if either SHA is missing
          merges=$(git rev-list --merges "$BASE_SHA..$HEAD_SHA")
          if [ -n "$merges" ]; then
            for c in $merges; do echo "::error::Commit $c is a merge commit"; done
            exit 1
          fi
