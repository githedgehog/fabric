# Default values for fabric-dhcpd.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/githedgehog/fabric/fabric-dhcpd
  pullPolicy: IfNotPresent
  tag: "0.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Deprecated, set only by older fabricator versions: listenInterface and
# anyDeviceOnMgmt are passed as flags that override the fabric-dhcpd-config
# ConfigMap. Leave them unset otherwise.
# listenInterface: ""
# anyDeviceOnMgmt: false

# Port for the liveness/readiness probes (/healthz, /readyz). The server listens
# on healthListen from the fabric-dhcpd-config ConfigMap (":8080" by default);
# any other port here is also passed to it as --health-listen, overriding the
# ConfigMap. Bound on the node since the pod uses hostNetwork, so it must not
# collide with other host services.
healthPort: 8080

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  runAsUser: 0

# The memory limit leaves headroom for request bursts: every request waiting for
# a lease write (up to requestTimeout) holds some memory.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi

nodeSelector: {}

tolerations: []

affinity: {}
