              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SwitchBootSpec defines the desired state of SwitchBoot.
            properties:
              agentVersion:
                description: AgentVersion is the version of the agent the switch should
                  be installed with
                type: string
              mac:
                description: MAC is the normalized MAC address of the switch management
                  port to identify it during the bootstrap
