---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: externalattachments.vpc.githedgehog.com
spec:
  group: vpc.githedgehog.com
  names:
    categories:
    - hedgehog
    - fabric
    - external
    kind: ExternalAttachment
    listKind: ExternalAttachmentList
    plural: externalattachments
    shortNames:
    - extattach
    singular: externalattachment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.external
      name: External
      type: string
    - jsonPath: .spec.connection
      name: Connection
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: string
    - jsonPath: .spec.switch.vlan
      name: SwVLAN
      priority: 1
      type: string
    - jsonPath: .spec.switch.ip
      name: SwIP
      priority: 1
      type: string
    - jsonPath: .spec.neighbor.asn
      name: NeighASN
      priority: 1
      type: string
    - jsonPath: .spec.neighbor.ip
      name: NeighIP
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          ExternalAttachment is a definition of how specific switch is connected with external system (External object).
          Effectively it represents BGP peering between the switch and external system including all needed configuration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired state of the ExternalAttachment
            properties:
              advertise:
                description: |-
                  Advertise controls how attractive we make this link to the external system, which is the
                  only say we have in which link it sends traffic back on. Not valid for static attachments.
                properties:
                  communities:
                    description: |-
                      Communities are attached to everything we advertise on this session, on top of the
                      External's outboundCommunity and advertise.communities. This is the per-link one: where a
                      provider publishes communities that steer its own route selection, giving the two sessions
                      to it different values acts on their local preference, which they weigh before both AS-path
                      length and MED.
                    items:
                      type: string
                    type: array
                  med:
                    description: |-
                      MED is the metric advertised on this session, lower being preferred. Defaults to
                      spec.priority * 10. Requires localASN on the External: without a shared ASN the external
                      system sees each border leaf as a different neighbouring AS and never compares the values.
                    format: int32
                    type: integer
                  prepend:
                    description: |-
                      Prepend is how many times to prepend our ASN to the routes advertised on this session,
                      on top of whatever the External itself prepends. Defaults to spec.priority, so a backup
                      link is de-preferred in both directions. Visible to the whole internet, not just to this
                      external system - use MED where the two links go to the same provider. This and the
                      External's own prepend add up, to at most 20 in total.
                    maximum: 10
                    minimum: 0
                    type: integer
                type: object
              bfd:
                description: |-
                  BFD (optional) enables BFD for the BGP session of this external attachment, an empty object
                  uses the fabric defaults
                properties:
                  minRX:
                    description: MinRX is the minimum interval in ms at which we accept
                      BFD control packets from the peer (default 300)
                    format: int32
                    maximum: 60000
                    minimum: 10
                    type: integer
                  minTX:
                    description: MinTX is the desired interval in ms at which we send
                      BFD control packets (default 300)
                    format: int32
                    maximum: 60000
                    minimum: 10
                    type: integer
                  multiplier:
                    description: Multiplier is how many missed packets bring the session
                      down (default 3)
                    maximum: 255
                    minimum: 2
                    type: integer
                  passive:
                    description: |-
                      Passive makes us wait for the peer to initiate the session instead of initiating it
                      ourselves, for the rare ISP that requires it. Both ends passive means no session at all.
                    type: boolean
                type: object
              connection:
                description: Connection is the name of the Connection object this
                  attachment belongs to (essentially the name of the switch/port)
                type: string
              external:
                description: External is the name of the External object this attachment
                  belongs to
                type: string
              inboundACL:
                description: InboundACL defines the ACL statements to apply to inbound
                  traffic on this external attachment
                properties:
                  statements:
                    items:
                      properties:
                        action:
                          type: string
                        dstPrefix:
                          type: string
                        icmpCode:
                          type: integer
                        icmpType:
                          type: integer
                        portRangeBegin:
                          type: integer
                        portRangeEnd:
                          type: integer
                        protocol:
                          type: string
                        seq:
                          type: integer
                        srcPrefix:
                          type: string
                        tcpFilters:
                          properties:
                            ack:
                              type: boolean
                            established:
                              type: boolean
                            fin:
                              type: boolean
                            notAck:
                              type: boolean
                            notFin:
                              type: boolean
                            notPsh:
                              type: boolean
                            notRst:
                              type: boolean
                            notSyn:
                              type: boolean
                            notUrg:
                              type: boolean
                            psh:
                              type: boolean
                            rst:
                              type: boolean
                            syn:
                              type: boolean
                            urg:
                              type: boolean
                          type: object
                      required:
                      - action
                      - dstPrefix
                      - protocol
                      - seq
                      - srcPrefix
                      type: object
                    type: array
                type: object
              neighbor:
                description: Neighbor is the BGP neighbor configuration for the external
                  attachment in case of a BGP external
                properties:
                  asn:
                    description: ASN is the ASN of the BGP neighbor
                    format: int32
                    type: integer
                  ip:
                    description: IP is the IP address of the BGP neighbor to peer
                      with (without prefix length)
                    type: string
                type: object
              priority:
                description: |-
                  Priority ranks this attachment against the other attachments of the same External. Lower is
                  preferred; equal priorities load-balance across border leaves, which is the existing behaviour
                  and the default. Fabric-wide: it is not overridable per VPC. Not valid for static attachments.
                maximum: 3
                minimum: 0
                type: integer
              static:
                description: Static contains parameters specific to a static external
                  attachment
                properties:
                  ip:
                    description: IP is the IP address (with prefix length) to be configured
                      on the switch when not using Proxy mode
                    type: string
                  proxy:
                    description: Proxy is a flag to enable proxy-ARP, used in conjunction
                      with Gateway peering
                    type: boolean
                  remoteIP:
                    description: RemoteIP is the IP address of the external, which
                      will be used as nexthop for prefixes reachable via this external
                      attachment
                    type: string
                  vlan:
                    description: VLAN (optional) is the VLAN ID used for the subinterface
                      on a switch port specified in the connection, set to 0 if no
                      VLAN is required
                    type: integer
                required:
                - remoteIP
                type: object
              switch:
                description: Switch is the switch port configuration for the external
                  attachment in case of a BGP external
                properties:
                  ip:
                    description: IP is the IP address of the subinterface on a switch
                      port specified in the connection, it should include the prefix
                      length
                    type: string
                  vlan:
                    description: VLAN (optional) is the VLAN ID used for the subinterface
                      on a switch port specified in the connection, set to 0 if no
                      VLAN is used
                    type: integer
                type: object
            required:
            - neighbor
            - switch
            type: object
          status:
            description: Status is the observed state of the ExternalAttachment
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
