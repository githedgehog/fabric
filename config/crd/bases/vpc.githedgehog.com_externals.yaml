---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: externals.vpc.githedgehog.com
spec:
  group: vpc.githedgehog.com
  names:
    categories:
    - hedgehog
    - fabric
    - external
    kind: External
    listKind: ExternalList
    plural: externals
    shortNames:
    - ext
    singular: external
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.ipv4Namespace
      name: IPv4NS
      type: string
    - jsonPath: .spec.inboundCommunity
      name: InComm
      type: string
    - jsonPath: .spec.outboundCommunity
      name: OutComm
      type: string
    - jsonPath: .spec.priority
      name: Priority
      priority: 1
      type: string
    - jsonPath: .spec.localASN
      name: LocalASN
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          External object represents an external system connected to the Fabric and available to the specific IPv4Namespace.
          Users can do external peering with the external system by specifying the name of the External Object without need to
          worry about the details of how external system is attached to the Fabric.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired state of the External
            properties:
              advertise:
                description: Advertise controls what we announce to this External
                  and how attractive we make it
                properties:
                  communities:
                    description: |-
                      Communities are optionally attached to everything we advertise to this External, carrying
                      provider policy rather than our preference ranking
                    items:
                      type: string
                    type: array
                  prefixes:
                    description: |-
                      Prefixes is our own address space to announce to this External, for instance the pool a
                      Gateway NATs VPC traffic into. The fabric never accepts these prefixes back.
                    items:
                      type: string
                    type: array
                  prepend:
                    description: |-
                      Prepend is how many times to prepend our own ASN to the routes advertised to this External,
                      making it less attractive to the world by that many AS hops. Defaults to spec.priority, so a
                      backup External is de-preferred in both directions. Unlike MED, this is visible to the whole
                      internet, not just to this External. This and the attachment's own prepend add up, to at
                      most 20 in total.
                    maximum: 10
                    minimum: 0
                    type: integer
                type: object
              inboundCommunity:
                description: InboundCommunity is the optional inbound community to
                  filter routes from the external system (e.g. 65102:5000)
                type: string
              ipv4Namespace:
                description: IPv4Namespace is the name of the IPv4Namespace this External
                  belongs to
                type: string
              localASN:
                description: |-
                  LocalASN makes every attachment to this External present the same ASN to the external system
                  instead of each border leaf's own. Without it the external system sees two neighbouring
                  ASNs and never compares the MEDs we send, so this is what makes advertise.med work. Opt-in
                  and never defaulted: changing it resets the sessions and the external system has to change
                  its remote-as to match. Not valid for static externals.
                format: int32
                type: integer
              outboundCommunity:
                description: OutboundCommunity is the optional outbound community
                  that all outbound routes will be stamped with (e.g. 50000:50001)
                type: string
              priority:
                description: |-
                  Priority is the default preference class for routes learned from this External, used by any
                  ExternalPeering that does not override it. Lower is preferred; equal priorities load-balance.
                  0 (the default) preserves the existing behaviour. Not valid for static externals.
                maximum: 3
                minimum: 0
                type: integer
              static:
                description: Static contains parameters specific to static externals
                properties:
                  prefixes:
                    description: Prefixes is the list of IPv4 prefixes reachable via
                      the external
                    items:
                      type: string
                    type: array
                type: object
            type: object
          status:
            description: Status is the observed state of the External
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
