---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: vpcinterconnects.vpc.githedgehog.com
spec:
  group: vpc.githedgehog.com
  names:
    categories:
    - hedgehog
    - fabric
    kind: VPCInterconnect
    listKind: VPCInterconnectList
    plural: vpcinterconnects
    shortNames:
    - vpcic
    singular: vpcinterconnect
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.topology.fabric
      name: Fabric
      type: string
    - jsonPath: .spec.topology.domain
      name: Domain
      type: string
    - jsonPath: .spec.ipv4Namespace
      name: IPv4NS
      type: string
    - jsonPath: .spec.remote.prefixes
      name: Remote
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          VPCInterconnect connects local VPCs to a remote router that hands off per VRF, such as a border leaf of
          another fabric. Every local VPC reaches every remote prefix, and nothing else: local VPCs don't reach
          each other through it, and only the listed subnets and prefixes are exchanged. It is made of an External
          named after it, an ExternalAttachment per link and an ExternalPeering per local VPC, which the controller
          creates and keeps as specified here, and which can't be changed or deleted on their own.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired state of the VPCInterconnect
            properties:
              ipv4Namespace:
                description: IPv4Namespace is the IPv4Namespace of the local VPCs
                  (if not specified, "default" is used)
                type: string
              links:
                description: Links are the BGP sessions to the remote router
                items:
                  description: VPCInterconnectLink is a BGP unnumbered session to
                    the remote router on an External connection
                  properties:
                    bfd:
                      description: BFD (optional) enables BFD for the session, an
                        empty object uses the fabric defaults
                      properties:
                        minRX:
                          description: MinRX is the minimum interval in ms at which
                            we accept BFD control packets from the peer (default 300)
                          format: int32
                          maximum: 60000
                          minimum: 10
                          type: integer
                        minTX:
                          description: MinTX is the desired interval in ms at which
                            we send BFD control packets (default 300)
                          format: int32
                          maximum: 60000
                          minimum: 10
                          type: integer
                        multiplier:
                          description: Multiplier is how many missed packets bring
                            the session down (default 3)
                          maximum: 255
                          minimum: 2
                          type: integer
                        passive:
                          description: |-
                            Passive makes us wait for the peer to initiate the session instead of initiating it
                            ourselves, for the rare ISP that requires it. Both ends passive means no session at all.
                          type: boolean
                      type: object
                    connection:
                      description: Connection is the name of the External Connection
                        the session runs over
                      type: string
                    inboundACL:
                      description: InboundACL (optional) defines the ACL statements
                        to apply to inbound traffic on this link
                      properties:
                        statements:
                          items:
                            properties:
                              action:
                                type: string
                              dstPrefix:
                                type: string
                              icmpCode:
                                type: integer
                              icmpType:
                                type: integer
                              portRangeBegin:
                                type: integer
                              portRangeEnd:
                                type: integer
                              protocol:
                                type: string
                              seq:
                                type: integer
                              srcPrefix:
                                type: string
                              tcpFilters:
                                properties:
                                  ack:
                                    type: boolean
                                  established:
                                    type: boolean
                                  fin:
                                    type: boolean
                                  notAck:
                                    type: boolean
                                  notFin:
                                    type: boolean
                                  notPsh:
                                    type: boolean
                                  notRst:
                                    type: boolean
                                  notSyn:
                                    type: boolean
                                  notUrg:
                                    type: boolean
                                  psh:
                                    type: boolean
                                  rst:
                                    type: boolean
                                  syn:
                                    type: boolean
                                  urg:
                                    type: boolean
                                type: object
                            required:
                            - action
                            - dstPrefix
                            - protocol
                            - seq
                            - srcPrefix
                            type: object
                          type: array
                      type: object
                    remoteASN:
                      description: RemoteASN (optional) is the ASN of the remote router,
                        if not set any ASN other than the switch's own is accepted
                      format: int32
                      type: integer
                    vlan:
                      description: |-
                        VLAN (optional) is the VLAN ID of the subinterface on the connection's switch port, 0 for no VLAN.
                        The remote end must use the same one
                      type: integer
                  type: object
                type: array
              local:
                additionalProperties:
                  description: VPCInterconnectVPC is a local VPC taking part in a
                    VPCInterconnect
                  properties:
                    subnets:
                      description: Subnets are the names of the VPC subnets advertised
                        to the remote side
                      items:
                        type: string
                      type: array
                  type: object
                description: Local are the local VPCs by name, with the subnets advertised
                  to the remote side
                type: object
              remote:
                description: Remote is what is accepted from the remote side
                properties:
                  prefixes:
                    description: |-
                      Prefixes are the IPv4 prefixes accepted from the remote side, each with any longer prefix within it as
                      in an ExternalPeering, so 0.0.0.0/0 accepts everything
                    items:
                      type: string
                    type: array
                type: object
              topology:
                description: Topology is where the VPCInterconnect sits in the fabric
                  topology
                properties:
                  domain:
                    description: |-
                      Domain is the Fabric domain the VPCInterconnect is in (if not specified, "default" is used). Its links
                      must be on switches of that domain and its VPCs must be in it, and it is immutable
                    type: string
                  fabric:
                    description: Fabric is the name of the Fabric this VPCInterconnect
                      belongs to (if not specified, "default" is used)
                    type: string
                type: object
            type: object
          status:
            description: Status is the observed state of the VPCInterconnect
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
