---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: fabriccontrollers.fcint.githedgehog.com
spec:
  group: fcint.githedgehog.com
  names:
    categories:
    - hedgehog
    kind: FabricController
    listKind: FabricControllerList
    plural: fabriccontrollers
    shortNames:
    - fc
    singular: fabriccontroller
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.initializedVersion
      name: Initialized
      type: string
    - jsonPath: .status.conditions[?(@.type=="Refreshing")].status
      name: Refreshing
      type: string
    - jsonPath: .status.refresh.passes
      name: Passes
      priority: 1
      type: integer
    - jsonPath: .spec.forceUnlock
      name: ForceUnlock
      priority: 1
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FabricController is the Schema for the fabriccontrollers API. It holds the state of the fabric controller itself:
          the version that completed initialization (including refreshing all stored objects with the current defaults) and
          the progress of that refresh. The fabric controller only reconciles and accepts user changes once it's initialized.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FabricControllerSpec defines the desired state of FabricController.
            properties:
              forceUnlock:
                description: |-
                  ForceUnlock unlocks the fabric controller regardless of the initialized version. It's a last resort for a
                  stuck refresh: objects that weren't refreshed don't carry the current defaults and labels
                type: boolean
            type: object
          status:
            description: FabricControllerStatus defines the observed state of FabricController.
            properties:
              conditions:
                description: 'Conditions of the fabric controller: Initialized and
                  Refreshing'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initializedVersion:
                description: |-
                  InitializedVersion is the fabric controller version that completed initialization, including the refresh of
                  stored objects. The fabric controller is locked until it matches the running version
                type: string
              refresh:
                description: Refresh is the progress of the last or current refresh
                  of stored objects
                properties:
                  finishedAt:
                    description: FinishedAt is the time the refresh finished
                    format: date-time
                    type: string
                  kinds:
                    description: Kinds is the progress per kind
                    items:
                      description: FabricControllerRefreshKind is the refresh progress
                        of a single kind
                      properties:
                        invalid:
                          description: |-
                            Invalid is the number of objects that fail the validation of the current version, checked without looking up
                            other objects. They still get the current defaults, but any change to them is rejected until they're fixed
                          type: integer
                        kind:
                          description: Kind is the kind of the refreshed objects
                          type: string
                        rejected:
                          description: Rejected is the number of objects whose update
                            was rejected
                          type: integer
                        stale:
                          description: Stale is the number of objects that still don't
                            carry the current defaults after retries
                          type: integer
                        total:
                          description: Total is the number of objects of the kind
                          type: integer
                        updated:
                          description: Updated is the number of objects updated with
                            the current defaults
                          type: integer
                      required:
                      - kind
                      - total
                      type: object
                    type: array
                  passes:
                    description: Passes is the number of passes over the stored objects
                      so far
                    type: integer
                  startedAt:
                    description: StartedAt is the time the refresh started
                    format: date-time
                    type: string
                  version:
                    description: Version is the fabric controller version running
                      the refresh
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
