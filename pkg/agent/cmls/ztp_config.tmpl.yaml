- set:
    interface:
      eth0:
        ipv4:
          address:
            {{ $.ManagementIP }}: {}
        type: eth
        vrf: mgmt
      {{- range $port := $.Ports }}
      {{ $port.Name }}:
        {{- if $port.Breakout }}
        link:
          breakout:
            {{ $port.Breakout }}: {}
        {{- else }}
        {{- if $port.Description }}
        description: {{ $port.Description }}
        {{- end }}
        ipv6:
          state: disabled
        link:
          {{- if $port.AutoNeg }}
          auto-negotiate: {{ $port.AutoNeg }}
          {{- end }}
          {{- if $port.FEC }}
          fec: '{{ $port.FEC }}'
          {{- end }}
          {{- if $port.Speed }}
          speed: {{ $port.Speed }}
          {{- end }}
          state:
            {{- if $port.Up }}
            up: {}
            {{- else }}
            down: {}
            {{- end }}
        lldp:
          state: enabled
        {{- end }}
      {{- end }}
      {{- range $bond := $.Bonds }}
      {{ $bond.Name }}:
        bond:
          {{- if $bond.LACPBypass }}
          lacp-bypass: enabled
          {{- end }}
          member:
            {{- range $member := $bond.Members }}
            {{ $member.Name }}: {}
            {{- end }}
        description: {{ $bond.Description }}
        ipv6:
          state: disabled
        link:
          state:
            {{- if $bond.Up }}
            up: {}
            {{- else }}
            down: {}
            {{- end }}
        type: bond
      {{- end }}
    system:
      aaa:
        class:
          nvapply:
            action: allow
            command-path:
              /:
                permission: all
          nvshow:
            action: allow
            command-path:
              /:
                permission: ro
          sudo:
            action: allow
            command-path:
              /:
                permission: all
        role:
          nvue-admin:
            class:
              nvapply: {}
          nvue-monitor:
            class:
              nvshow: {}
          system-admin:
            class:
              nvapply: {}
              sudo: {}
        user:
          {{- range $user := $.Users }}
            {{ $user.Name }}:
              hashed-password: {{ $user.HashedPassword }}
              role: {{ $user.Role }}
              {{- if $user.SSHKeys }}
              ssh:
                authorized-key:
                  {{- range $id, $key := $user.SSHKeys }}
                    key-{{ $id }}:
                      key: {{ $key.Key }}
                      type: {{ $key.Type }}
                  {{- end }}
              {{- end }}
          {{- end }}
      api:
        state: enabled
      config:
        auto-save:
          state: enabled
      control-plane:
        acl:
          acl-default-dos:
            inbound: {}
          acl-default-whitelist:
            inbound: {}
      docker:
        vrf: mgmt
      hostname: {{ $.Hostname }}
      lldp:
        state: enabled
        tx-hold-multiplier: 24
        tx-interval: 5
      ntp:
        listen:
          eth0: {}
        server:
          {{ $.NTPServer }}:
            iburst: enabled
        state: enabled
        vrf: mgmt
      ssh-server:
        allow-users:
          {{- range $user := $.Users }}
            {{ $user.Name }}: {}
          {{- end }}
        permit-root-login: disabled
        state: enabled
      wjh:
        channel:
          forwarding:
            trigger:
              l2: {}
              l3: {}
              tunnel: {}
        state: enabled
