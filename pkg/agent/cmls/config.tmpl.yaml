- set:
    {{- if or $.SubnetACLs $.Restricted }}
    acl:
      {{- range $subnet := $.Restricted }}
      {{ $subnet.RestrictedACL }}:
        rule:
          '1':
            action:
              deny: {}
            match:
              ip:
                dest-ip: {{ $subnet.Subnet }}
                source-ip: {{ $subnet.Subnet }}
              vlan: {{ $subnet.VLAN }}
        type: ipv4
      {{- end }}
      {{- range $subnet := $.SubnetACLs }}
      {{ $subnet.ACL }}:
        rule:
          {{- range $id, $prefix := $subnet.Deny }}
          '{{ $id }}':
            action:
              deny: {}
            match:
              ip:
                dest-ip: {{ $prefix }}
          {{- end }}
          '65535':
            action:
              permit: {}
        type: ipv4
      {{- end }}
    {{- end }}
    interface:
      eth0:
        ipv6:
          state: disabled
        ipv4:
          address:
            {{ $.ManagementIP }}: {}
        type: eth
        vrf: mgmt
      lo:
        ipv4:
          address:
            {{ $.ProtocolIP }}: {}
            {{- if $.VTEPIP }}
            {{ $.VTEPIP }}: {}
            {{- end }}
        type: loopback
      {{- range $port := $.Ports }}
      {{ $port.Name }}:
        {{- if $port.Breakout }}
        link:
          breakout:
            {{ $port.Breakout }}: {}
        {{- else }}
        {{- if $port.Description }}
        description: {{ $port.Description }}
        {{- end }}
        ipv6:
          state: disabled
        lldp:
          state: enabled
        qos:
          pfc-watchdog:
            state: enable
        link:
          {{- if $port.AutoNeg }}
          auto-negotiate: {{ $port.AutoNeg }}
          {{- end }}
          {{- if $port.FEC }}
          fec: '{{ $port.FEC }}'
          {{- end }}
          {{- if $port.Speed }}
          speed: {{ $port.Speed }}
          {{- end }}
          state:
            {{- if $port.Up }}
            up: {}
            {{- else }}
            down: {}
            {{- end }}
        {{- end }}
        {{- if $port.ACLs }}
        acl:
          {{- range $acl := $port.ACLs }}
          {{ $acl }}:
            inbound: {}
          {{- end }}
        {{- end }}
        {{- if $port.VLANs }}
        bridge:
          domain:
            br_default:
              {{- if $port.Untagged }}
              untagged: {{ $port.Untagged }}
              {{- else }}
              untagged: none
              {{- end }}
              vlan:
                {{- range $vlan := $port.VLANs }}
                '{{ $vlan }}': {}
                {{- end }}
        {{- end }}
        {{- if $port.IP }}
        ipv4:
          address:
            {{ $port.IP }}: {}
        {{- end }}
        {{- if $port.AdaptiveRouting }}
        router:
          adaptive-routing:
            state: enabled
        {{- end }}
      {{- end }}
      {{- range $bond := $.Bonds }}
      {{ $bond.Name }}:
        bond:
          {{- if $bond.LACPBypass }}
          lacp-bypass: enabled
          {{- end }}
          member:
            {{- range $member := $bond.Members }}
            {{ $member.Name }}: {}
            {{- end }}
        description: {{ $bond.Description }}
        ipv6:
          state: disabled
        link:
          state:
            {{- if $bond.Up }}
            up: {}
            {{- else }}
            down: {}
            {{- end }}
        type: bond
        {{- if $bond.ACLs }}
        acl:
          {{- range $acl := $bond.ACLs }}
          {{ $acl }}:
            inbound: {}
          {{- end }}
        {{- end }}
        {{- if $bond.VLANs }}
        bridge:
          domain:
            br_default:
              {{- if $bond.Untagged }}
              untagged: {{ $bond.Untagged }}
              {{- else }}
              untagged: none
              {{- end }}
              vlan:
                {{- range $vlan := $bond.VLANs }}
                '{{ $vlan }}': {}
                {{- end }}
        {{- end }}
      {{- end }}
      {{- range $subnet := $.Subnets }}
      {{ $subnet.Name }}:
        {{- if $subnet.Deny }}
        acl:
          {{ $subnet.ACL }}:
            inbound: {}
        {{- end }}
        description: {{ $subnet.Description }}
        ipv4:
          address:
            {{ $subnet.IP }}: {}
          vrr:
            address:
              {{ $subnet.Gateway }}: {}
            mac-address: 00:00:00:11:11:11
            state: enabled
        ipv6:
          state: disabled
        type: svi
        vlan: {{ $subnet.VLAN }}
        vrf: {{ $subnet.VRF }}
      {{- end }}
    {{- if $.Subnets }}
    bridge:
      domain:
        br_default:
          stp:
            state:
              down: {}
          untagged: none
          vlan:
            {{- range $subnet := $.Subnets }}
            '{{ $subnet.VLAN }}':
              vni:
                '{{ $subnet.VNI }}': {}
            {{- end }}
    {{- end }}
    evpn:
      state: enabled
    {{- if $.IsLeaf }}
    nve:
      vxlan:
        arp-nd-suppress: enabled
        decapsulation:
          dscp:
            action: preserve
        encapsulation:
          dscp:
            action: copy
        source:
          address: {{ $.VXLANSource }}
        state: enabled
    {{- end }}
    qos:
      {{- if $.IsSpectrum4 }}
      pfc:
        default-global:
          port-buffer: 363000
          switch-priority:
            '3': {}
          xoff-threshold: 75000
          xon-threshold: 75000
      {{- end }}
      roce:
        mode: lossless
        state: enabled
      traffic-pool:
        default-lossy:
          memory-percent: 10
        roce-lossless:
          memory-percent: 90
    router:
      bfd:
        profile:
          overlay:
            detect-multiplier: 3
            min-rx-interval: 1000
            min-tx-interval: 1000
          underlay:
            detect-multiplier: 3
            min-rx-interval: 300
            min-tx-interval: 300
        state: enabled
      bgp:
        autonomous-system: {{ $.ASN }}
        router-id: {{ $.RouterID }}
        graceful-restart:
          mode: full
          path-selection-deferral-time: 180
          restart-time: 180
          stale-routes-time: 180
        state: enabled
      policy:
        {{- if $.VPCs }}
        prefix-list:
          {{- range $vpc := $.VPCs }}
          vpc-not-subnets--{{ $vpc.Name }}:
            rule:
              {{- range $seq, $subnet := $vpc.Subnets }}
              '{{ $seq }}':
                action: deny
                match:
                  {{ $subnet }}:
                    max-prefix-len: 32
              {{- end }}
              '65535':
                action: permit
                match:
                  0.0.0.0/0:
                    max-prefix-len: 32
            type: ipv4
          {{- if $vpc.PeerSubnets }}
          vpc-peers--{{ $vpc.Name }}:
            rule:
              {{- range $seq, $subnet := $vpc.PeerSubnets }}
              '{{ $seq }}':
                action: permit
                match:
                  {{ $subnet }}:
                    max-prefix-len: 32
              {{- end }}
            type: ipv4
          {{- end }}
          vpc-subnets--{{ $vpc.Name }}:
            rule:
              {{- range $seq, $subnet := $vpc.Subnets }}
              '{{ $seq }}':
                action: permit
                match:
                  {{ $subnet }}:
                    max-prefix-len: 32
              {{- end }}
            type: ipv4
          {{- end }}
        {{- end }}
        route-map:
          {{- range $vpc := $.VPCs }}
          {{- if $vpc.Peers }}
          import-vrf--{{ $vpc.Name }}:
            rule:
              {{- range $peer := $vpc.Peers }}
              '{{ $peer.RuleID }}':
                action:
                  deny: {}
                match:
                  ip-prefix-list: vpc-not-subnets--{{ $peer.Name }}
                  source-vrf: {{ $peer.Name }}
                  type: ipv4
              {{- end }}
              '50000':
                action:
                  permit: {}
                match:
                  ip-prefix-list: vpc-peers--{{ $vpc.Name }}
                  type: ipv4
              '65535':
                action:
                  deny: {}
          {{- end }}
          vpc-redistribute-connected--{{ $vpc.Name }}:
            rule:
              '10':
                action:
                  permit: {}
                match:
                  ip-prefix-list: vpc-subnets--{{ $vpc.Name }}
                  type: ipv4
          {{- end }}
          lo_to_bgp:
            rule:
              '10':
                action:
                  permit: {}
                description: permit_lo_to_bgp
                match:
                  interface: lo
                  type: ipv4
          w_ecmp_cumulative:
            rule:
              '10':
                action:
                  permit: {}
                description: enable_w_ecmp_adjustment
                set:
                  ext-community-bw: cumulative
          w_ecmp_origin:
            rule:
              '10':
                action:
                  permit: {}
                description: enable_w_ecmp_origination
                set:
                  ext-community-bw: multipaths
      {{- if $.IsSpectrum4 }}
      adaptive-routing:
        state: enabled
        profile: profile-custom
      {{- end }}
      {{- if $.Subnets }}
      vrr:
        state: enabled
      {{- end }}
    vrf:
      default:
        router:
          bgp:
            address-family:
              ipv4-unicast:
                redistribute:
                  connected:
                    route-map: lo_to_bgp
                    state: enabled
                state: enabled
              l2vpn-evpn:
                state: enabled
            peer-group:
              underlay_spine:
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: w_ecmp_origin
                bfd:
                  profile: underlay
                remote-as: external
              underlay_leaf:
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: w_ecmp_cumulative
                bfd:
                  profile: underlay
                remote-as: external
              overlay:
                address-family:
                  ipv4-unicast:
                    state: disabled
                  l2vpn-evpn:
                    state: enabled
                bfd:
                  profile: overlay
                multihop-ttl: 2
                remote-as: external
                update-source: lo
            {{- if $.BGPNeighbors }}
            neighbor:
              {{- range $neigh := $.BGPNeighbors }}
              {{ $neigh.IP }}:
                {{- if $neigh.Description }}
                description: {{ $neigh.Description }}
                {{- end }}
                peer-group: {{ $neigh.PeerGroup }}
                type: numbered
              {{- end }}
            {{- end }}
            state: enabled
      {{- range $vpc := $.VPCs }}
      {{ $vpc.Name }}:
        evpn:
          state: enabled
          vni:
            '{{ $vpc.VNI }}': {}
        router:
          bgp:
            address-family:
              ipv4-unicast:
                redistribute:
                  connected:
                    route-map: vpc-redistribute-connected--{{ $vpc.Name }}
                    state: enabled
                route-export:
                  to-evpn:
                    state: enabled
                {{- if $vpc.Peers }}
                route-import:
                  from-vrf:
                    list:
                      {{- range $peer := $vpc.Peers }}
                      {{ $peer.Name }}: {}
                      {{- end }}
                    route-map: import-vrf--{{ $vpc.Name }}
                    state: enabled
                {{- end }}
                {{- if $vpc.RouteSumm }}
                aggregate-route:
                  {{- range $route := $vpc.RouteSumm }}
                  {{ $route }}:
                    summary-only: enabled
                  {{- end }}
                {{- end }}
                state: enabled
              l2vpn-evpn:
                state: enabled
            path-selection:
              multipath:
                aspath-ignore: enabled
            rd: {{ $.RouterID }}:{{ $vpc.VNI }}
            state: enabled
      {{- end }}
    {{- if $.DHCPServer }}
    service:
      dhcp-relay:
        mgmt:
          agent:
            remote-id: cumulus:{{ $.Hostname }}
            state: enabled
          downstream-interface:
            {{- range $subnet := $.Subnets }}
            {{- if $subnet.DHCP }}
            {{ $subnet.Name }}:
              server-group-name: hh
            {{- end }}
            {{- end }}
          gateway-interface:
            eth0:
              address: auto
          server-group:
            hh:
              server:
                {{ $.DHCPServer }}: {}
              upstream-interface:
                eth0: {}
    {{- end }}
    system:
      aaa:
        class:
          nvapply:
            action: allow
            command-path:
              /:
                permission: all
          nvshow:
            action: allow
            command-path:
              /:
                permission: ro
          sudo:
            action: allow
            command-path:
              /:
                permission: all
        role:
          nvue-admin:
            class:
              nvapply: {}
          nvue-monitor:
            class:
              nvshow: {}
          system-admin:
            class:
              nvapply: {}
              sudo: {}
        user:
          {{- range $user := $.Users }}
            {{ $user.Name }}:
              hashed-password: {{ $user.HashedPassword }}
              role: {{ $user.Role }}
              {{- if $user.SSHKeys }}
              ssh:
                authorized-key:
                  {{- range $id, $key := $user.SSHKeys }}
                    key-{{ $id }}:
                      key: {{ $key.Key }}
                      type: {{ $key.Type }}
                  {{- end }}
              {{- end }}
          {{- end }}
      api:
        listening-address:
          127.0.0.1: {}
        state: enabled
      config:
        auto-save:
          state: enabled
        {{- if or $.IsSpectrum4 $.Subnets }}
        snippet:
          {{- if $.IsSpectrum4 }}
          adaptive_routing_conf-snippet:
            file: /etc/cumulus/switchd.d/ar_profile_custom.conf
            content: |
              ar.p.m = 0
              ar.ctl = 400
              ar.ctm = 800
              ar.cth = 2000
              ar.srt = 10
              ar.srf = 10
              ar.p.bit = 0
              ar.p.frt = 4
              ar.p.but = 0
              ar.p.sfe = FALSE
              ar.p.ste = FALSE
              ar.p.ef = FALSE
              ar.ecs = 512
              ar.ibm = ingress
          {{- end }}
          {{- if $.Subnets }}
          ifupdown2_eni:
            {{- range $subnet := $.Subnets }}
            {{ $subnet.Name }}: |
              address-virtual-ipv6-addrgen off
            {{- end }}
          {{- end }}
        {{- end }}
      control-plane:
        acl:
          acl-default-dos:
            inbound: {}
          acl-default-whitelist:
            inbound: {}
      docker:
        vrf: mgmt
      hostname: {{ $.Hostname }}
      lldp:
        state: enabled
        tx-hold-multiplier: 24
        tx-interval: 5
      ntp:
        listen:
          eth0: {}
        server:
          {{ $.NTPServer }}:
            iburst: enabled
        state: enabled
        vrf: mgmt
      ssh-server:
        allow-users:
          {{- range $user := $.Users }}
            {{ $user.Name }}: {}
          {{- end }}
        permit-root-login: disabled
        state: enabled
        vrf:
          mgmt: {}
      wjh:
        channel:
          forwarding:
            trigger:
              l2: {}
              l3: {}
              tunnel: {}
        state: enabled
