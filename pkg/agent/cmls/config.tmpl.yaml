- set:
    {{- if or $.SubnetACLs $.Restricted $.ACLs }}
    acl:
      {{- range $acl := $.ACLs }}
      {{ $acl.Name }}:
        rule:
          {{- range $rule := $acl.Rules }}
          '{{ $rule.ID }}':
            action:
              {{ if $rule.Permit }}permit{{ else }}deny{{ end }}: {}
            {{- if $rule.HasMatch }}
            match:
              ip:
                {{- if $rule.DstIP }}
                dest-ip: {{ $rule.DstIP }}
                {{- end }}
                {{- if $rule.ICMPType }}
                icmp-type: {{ $rule.ICMPType }}
                {{- end }}
                {{- if $rule.Protocol }}
                protocol: {{ $rule.Protocol }}
                {{- end }}
                {{- if $rule.SrcIP }}
                source-ip: {{ $rule.SrcIP }}
                {{- end }}
                {{- if or $rule.DstPort $rule.TCPMask $rule.TCPEstablished }}
                {{ $rule.Protocol }}:
                  {{- if $rule.DstPort }}
                  dest-port:
                    '{{ $rule.DstPort }}': {}
                  {{- end }}
                  {{- if $rule.TCPMask }}
                  flags:
                    {{- range $flag := $rule.TCPFlags }}
                    {{ $flag }}: {}
                    {{- end }}
                  mask:
                    {{- range $flag := $rule.TCPMask }}
                    {{ $flag }}: {}
                    {{- end }}
                  {{- end }}
                  {{- if $rule.TCPEstablished }}
                  state: established
                  {{- end }}
                {{- end }}
            {{- end }}
          {{- end }}
        type: ipv4
      {{- end }}
      {{- range $subnet := $.Restricted }}
      {{ $subnet.RestrictedACL }}:
        rule:
          '1':
            action:
              deny: {}
            match:
              ip:
                dest-ip: {{ $subnet.Subnet }}
                source-ip: {{ $subnet.Subnet }}
              vlan: {{ $subnet.VLAN }}
        type: ipv4
      {{- end }}
      {{- range $subnet := $.SubnetACLs }}
      {{ $subnet.ACL }}:
        rule:
          {{- range $id, $prefix := $subnet.Deny }}
          '{{ $id }}':
            action:
              deny: {}
            match:
              ip:
                dest-ip: {{ $prefix }}
          {{- end }}
          '65535':
            action:
              permit: {}
        type: ipv4
      {{- end }}
    {{- end }}
    interface:
      eth0:
        ipv6:
          state: disabled
        ipv4:
          address:
            {{ $.ManagementIP }}: {}
        type: eth
        vrf: mgmt
      lo:
        ipv4:
          address:
            {{ $.ProtocolIP }}: {}
            {{- if $.VTEPIP }}
            {{ $.VTEPIP }}: {}
            {{- end }}
        type: loopback
      {{- range $port := $.Ports }}
      {{ $port.Name }}:
        {{- if $port.Breakout }}
        link:
          breakout:
            {{ $port.Breakout }}: {}
        {{- else }}
        {{- if $port.Description }}
        description: {{ $port.Description }}
        {{- end }}
        ipv6:
          state: {{ if $port.IPv6 }}enabled{{ else }}disabled{{ end }}
        lldp:
          state: enabled
        qos:
          pfc-watchdog:
            state: enable
        link:
          {{- if $port.AutoNeg }}
          auto-negotiate: {{ $port.AutoNeg }}
          {{- end }}
          {{- if $port.FEC }}
          fec: '{{ $port.FEC }}'
          {{- end }}
          {{- if $port.Speed }}
          speed: {{ $port.Speed }}
          {{- end }}
          state:
            {{- if $port.Up }}
            up: {}
            {{- else }}
            down: {}
            {{- end }}
        {{- end }}
        {{- if or $port.ACLs $port.ExtACLs }}
        acl:
          {{- range $acl := $port.ACLs }}
          {{ $acl }}:
            inbound: {}
          {{- end }}
          {{- range $acl := $port.ExtACLs }}
          {{ $acl.Name }}:
            {{ $acl.Direction }}: {}
          {{- end }}
        {{- end }}
        {{- if $port.VLANs }}
        bridge:
          domain:
            br_default:
              {{- if $port.Untagged }}
              untagged: {{ $port.Untagged }}
              {{- else }}
              untagged: none
              {{- end }}
              vlan:
                {{- range $vlan := $port.VLANs }}
                '{{ $vlan }}': {}
                {{- end }}
        {{- end }}
        {{- if $port.IP }}
        ipv4:
          address:
            {{ $port.IP }}: {}
        {{- end }}
        {{- if $port.AdaptiveRouting }}
        router:
          adaptive-routing:
            state: enabled
        {{- end }}
        {{- if $port.VRF }}
        vrf: {{ $port.VRF }}
        {{- end }}
      {{- end }}
      {{- range $bond := $.Bonds }}
      {{ $bond.Name }}:
        bond:
          {{- if $bond.LACPBypass }}
          lacp-bypass: enabled
          {{- end }}
          member:
            {{- range $member := $bond.Members }}
            {{ $member.Name }}: {}
            {{- end }}
        description: {{ $bond.Description }}
        ipv6:
          state: disabled
        link:
          state:
            {{- if $bond.Up }}
            up: {}
            {{- else }}
            down: {}
            {{- end }}
        type: bond
        {{- if $bond.ACLs }}
        acl:
          {{- range $acl := $bond.ACLs }}
          {{ $acl }}:
            inbound: {}
          {{- end }}
        {{- end }}
        {{- if $bond.VLANs }}
        bridge:
          domain:
            br_default:
              {{- if $bond.Untagged }}
              untagged: {{ $bond.Untagged }}
              {{- else }}
              untagged: none
              {{- end }}
              vlan:
                {{- range $vlan := $bond.VLANs }}
                '{{ $vlan }}': {}
                {{- end }}
        {{- end }}
      {{- end }}
      {{- range $subif := $.Subinterfaces }}
      {{ $subif.Name }}:
        {{- if $subif.ACLs }}
        acl:
          {{- range $acl := $subif.ACLs }}
          {{ $acl.Name }}:
            {{ $acl.Direction }}: {}
          {{- end }}
        {{- end }}
        base-interface: {{ $subif.Port }}
        description: {{ $subif.Description }}
        {{- if $subif.IP }}
        ipv4:
          address:
            {{ $subif.IP }}: {}
        {{- end }}
        ipv6:
          state: {{ if $subif.IP }}disabled{{ else }}enabled{{ end }}
        type: sub
        vlan: {{ $subif.VLAN }}
        vrf: {{ $subif.VRF }}
      {{- end }}
      {{- range $subnet := $.Subnets }}
      {{ $subnet.Name }}:
        {{- if $subnet.Deny }}
        acl:
          {{ $subnet.ACL }}:
            inbound: {}
        {{- end }}
        description: {{ $subnet.Description }}
        ipv4:
          address:
            {{ $subnet.IP }}: {}
          vrr:
            address:
              {{ $subnet.Gateway }}: {}
            mac-address: 00:00:00:11:11:11
            state: enabled
        ipv6:
          state: disabled
        type: svi
        vlan: {{ $subnet.VLAN }}
        vrf: {{ $subnet.VRF }}
      {{- end }}
    {{- if $.Subnets }}
    bridge:
      domain:
        br_default:
          stp:
            state:
              down: {}
          untagged: none
          vlan:
            {{- range $subnet := $.Subnets }}
            '{{ $subnet.VLAN }}':
              vni:
                '{{ $subnet.VNI }}': {}
            {{- end }}
    {{- end }}
    evpn:
      state: enabled
    {{- if $.IsLeaf }}
    nve:
      vxlan:
        arp-nd-suppress: enabled
        decapsulation:
          dscp:
            action: preserve
        encapsulation:
          dscp:
            action: copy
        source:
          address: {{ $.VXLANSource }}
        state: enabled
    {{- end }}
    qos:
      {{- if $.IsSpectrum4 }}
      pfc:
        default-global:
          port-buffer: 363000
          switch-priority:
            '3': {}
          xoff-threshold: 75000
          xon-threshold: 75000
      {{- end }}
      roce:
        mode: lossless
        state: enabled
      traffic-pool:
        default-lossy:
          memory-percent: 10
        roce-lossless:
          memory-percent: 90
    router:
      bfd:
        profile:
          overlay:
            detect-multiplier: 3
            min-rx-interval: 1000
            min-tx-interval: 1000
          underlay:
            detect-multiplier: 3
            min-rx-interval: 300
            min-tx-interval: 300
          {{- range $bfd := $.BFDProfiles }}
          {{ $bfd.Name }}:
            detect-multiplier: {{ $bfd.Multiplier }}
            min-rx-interval: {{ $bfd.MinRX }}
            min-tx-interval: {{ $bfd.MinTX }}
            {{- if $bfd.Passive }}
            passive-mode: enabled
            {{- end }}
          {{- end }}
        state: enabled
      bgp:
        autonomous-system: {{ $.ASN }}
        router-id: {{ $.RouterID }}
        graceful-restart:
          mode: full
          path-selection-deferral-time: 180
          restart-time: 180
          stale-routes-time: 180
        state: enabled
      policy:
        {{- if or $.Gateway $.FabricASPaths }}
        as-path-list:
          {{- if $.FabricASPaths }}
          fabric-gw-aspath:
            rule:
              {{- range $seq, $path := $.FabricASPaths }}
              '{{ $seq }}':
                action: permit
                aspath-exp: {{ $path }}
              {{- end }}
          {{- end }}
          {{- if $.Gateway }}
          gateway-origin:
            rule:
              '10':
                action: permit
                aspath-exp: ^{{ $.Gateway.ASN }}$
          {{- end }}
        {{- end }}
        {{- if or $.IsLeaf $.Externals }}
        community-list:
          all-externals:
            rule:
              '10':
                action: permit
                community:
                  {{ $.BaseVPCCommunity }}: {}
          {{- if and $.BGPExternals $.GatewayPrios }}
          all-gw-prios:
            rule:
              {{- range $prio := $.GatewayPrios }}
              '{{ $prio.RuleID }}':
                action: permit
                community:
                  {{ $prio.Community }}: {}
              {{- end }}
          {{- end }}
          {{- range $ext := $.Externals }}
          {{- if and $ext.Neighbors $ext.InboundCommunity }}
          ext-inbound--{{ $ext.Name }}:
            rule:
              '10':
                action: permit
                community:
                  {{ $ext.InboundCommunity }}: {}
          {{- end }}
          {{- end }}
          {{- range $prio := $.GatewayPrios }}
          {{ $prio.Name }}:
            rule:
              '10':
                action: permit
                community:
                  {{ $prio.Community }}: {}
          {{- end }}
        {{- end }}
        {{- if or $.VPCs $.Gateway $.BGPExternals }}
        prefix-list:
          {{- if $.Gateway }}
          all-vtep-prefixes:
            rule:
              '10':
                action: permit
                match:
                  {{ $.Gateway.VTEPSubnet }}:
                    max-prefix-len: 32
            type: ipv4
          {{- end }}
          {{- range $ns := $.IPv4Namespaces }}
          ipns-subnets--{{ $ns.Name }}:
            rule:
              {{- range $seq, $subnet := $ns.Subnets }}
              '{{ $seq }}':
                action: permit
                match:
                  {{ $subnet }}:
                    max-prefix-len: 32
              {{- end }}
            type: ipv4
          {{- end }}
          {{- range $ext := $.Externals }}
          {{- if $ext.ImportPrefixes }}
          ext-import--{{ $ext.Name }}:
            rule:
              {{- range $seq, $subnet := $ext.ImportPrefixes }}
              '{{ $seq }}':
                action: permit
                match:
                  {{ $subnet }}:
                    max-prefix-len: 32
              {{- end }}
            type: ipv4
          {{- end }}
          {{- if and $ext.Neighbors $ext.InboundPrefixes }}
          ext-inbound--{{ $ext.Name }}:
            rule:
              {{- range $seq, $entry := $ext.InboundPrefixes }}
              '{{ $seq }}':
                action: permit
                match:
                  {{- if $entry.MaxLen }}
                  {{ $entry.Prefix }}:
                    max-prefix-len: {{ $entry.MaxLen }}
                    {{- if $entry.MinLen }}
                    min-prefix-len: {{ $entry.MinLen }}
                    {{- end }}
                  {{- else }}
                  {{ $entry.Prefix }}: {}
                  {{- end }}
              {{- end }}
            type: ipv4
          {{- end }}
          {{- end }}
          {{- range $vpc := $.VPCs }}
          {{- range $peer := $vpc.ExtPeers }}
          {{ $peer.PrefixList }}:
            rule:
              {{- range $seq, $prefix := $peer.Prefixes }}
              '{{ $seq }}':
                action: permit
                match:
                  {{ $prefix }}:
                    max-prefix-len: 32
              {{- end }}
            type: ipv4
          {{- end }}
          vpc-not-subnets--{{ $vpc.Name }}:
            rule:
              {{- range $seq, $subnet := $vpc.Subnets }}
              '{{ $seq }}':
                action: deny
                match:
                  {{ $subnet }}:
                    max-prefix-len: 32
              {{- end }}
              '65535':
                action: permit
                match:
                  0.0.0.0/0:
                    max-prefix-len: 32
            type: ipv4
          {{- if $vpc.PeerSubnets }}
          vpc-peers--{{ $vpc.Name }}:
            rule:
              {{- range $seq, $subnet := $vpc.PeerSubnets }}
              '{{ $seq }}':
                action: permit
                match:
                  {{ $subnet }}:
                    max-prefix-len: 32
              {{- end }}
            type: ipv4
          {{- end }}
          vpc-subnets--{{ $vpc.Name }}:
            rule:
              {{- range $seq, $subnet := $vpc.Subnets }}
              '{{ $seq }}':
                action: permit
                match:
                  {{ $subnet }}:
                    max-prefix-len: 32
              {{- end }}
            type: ipv4
          {{- end }}
        {{- end }}
        route-map:
          {{- if $.Gateway }}
          gateway-export:
            rule:
              '10':
                action:
                  permit: {}
                match:
                  ip-prefix-list: all-vtep-prefixes
                  type: ipv4
          gateway-import:
            rule:
              '10':
                action:
                  permit: {}
                match:
                  as-path-list: gateway-origin
          {{- end }}
          {{- if $.IsLeaf }}
          l2vpn-neighbors:
            rule:
              {{- range $prio := $.GatewayPrios }}
              '{{ $prio.RuleID }}':
                action:
                  permit: {}
                match:
                  community-list: {{ $prio.Name }}
                set:
                  local-preference: {{ $prio.LocalPref }}
              {{- end }}
              '65525':
                action:
                  permit: {}
                match:
                  community-list: all-externals
                set:
                  local-preference: 150
              '65535':
                action:
                  permit: {}
          {{- end }}
          {{- if $.Externals }}
          ext-to-evpn:
            rule:
              '10':
                action:
                  permit: {}
                match:
                  community-list: all-externals
          {{- end }}
          {{- range $ext := $.Externals }}
          {{- if $ext.ImportPrefixes }}
          ext-import--{{ $ext.Name }}:
            rule:
              '10':
                action:
                  permit: {}
                match:
                  ip-prefix-list: ext-import--{{ $ext.Name }}
                  type: ipv4
          {{- end }}
          {{- if $ext.Neighbors }}
          ext-inbound--{{ $ext.Name }}:
            rule:
              {{- if $.FabricASPaths }}
              '5':
                action:
                  deny: {}
                match:
                  as-path-list: fabric-gw-aspath
              {{- end }}
              '10':
                action:
                  deny: {}
                match:
                  ip-prefix-list: ipns-subnets--{{ $ext.IPv4Namespace }}
                  type: ipv4
              '15':
                action:
                  permit: {}
                {{- if or $ext.InboundCommunity $ext.InboundPrefixes }}
                match:
                  {{- if $ext.InboundCommunity }}
                  community-list: ext-inbound--{{ $ext.Name }}
                  {{- end }}
                  {{- if $ext.InboundPrefixes }}
                  ip-prefix-list: ext-inbound--{{ $ext.Name }}
                  type: ipv4
                  {{- end }}
                {{- end }}
                set:
                  community:
                    {{- range $comm := $ext.SetCommunities }}
                    {{ $comm }}: {}
                    {{- end }}
                  local-preference: 150
          ext-outbound--{{ $ext.Name }}:
            rule:
              '10':
                action:
                  permit: {}
                match:
                  ip-prefix-list: ipns-subnets--{{ $ext.IPv4Namespace }}
                  type: ipv4
                {{- if $ext.OutboundCommunity }}
                set:
                  community:
                    {{ $ext.OutboundCommunity }}: {}
                {{- end }}
              {{- if $.GatewayPrios }}
              '20':
                action:
                  permit: {}
                match:
                  community-list: all-gw-prios
                {{- if $ext.OutboundCommunity }}
                set:
                  community:
                    {{ $ext.OutboundCommunity }}: {}
                {{- end }}
              {{- end }}
          {{- end }}
          {{- if $ext.Static }}
          ext-static--{{ $ext.Name }}:
            rule:
              '10':
                action:
                  permit: {}
                set:
                  community:
                    {{ $.BaseVPCCommunity }}: {}
          {{- end }}
          {{- end }}
          {{- range $vpc := $.VPCs }}
          {{- if $vpc.ImportVRFs }}
          import-vrf--{{ $vpc.Name }}:
            rule:
              {{- range $peer := $vpc.ExtPeers }}
              '{{ $peer.DenyRuleID }}':
                action:
                  deny: {}
                match:
                  ip-prefix-list: ipns-subnets--{{ $peer.IPv4Namespace }}
                  source-vrf: {{ $peer.VRF }}
                  type: ipv4
              {{- end }}
              {{- range $peer := $vpc.Peers }}
              '{{ $peer.RuleID }}':
                action:
                  deny: {}
                match:
                  ip-prefix-list: vpc-not-subnets--{{ $peer.Name }}
                  source-vrf: {{ $peer.VRF }}
                  type: ipv4
              {{- end }}
              {{- if $vpc.Peers }}
              '50000':
                action:
                  permit: {}
                match:
                  ip-prefix-list: vpc-peers--{{ $vpc.Name }}
                  type: ipv4
              {{- end }}
              {{- range $peer := $vpc.ExtPeers }}
              '{{ $peer.PermitRuleID }}':
                action:
                  permit: {}
                match:
                  {{- if $peer.CommunityList }}
                  community-list: {{ $peer.CommunityList }}
                  {{- end }}
                  ip-prefix-list: {{ $peer.PrefixList }}
                  source-vrf: {{ $peer.VRF }}
                  type: ipv4
                set:
                  local-preference: 150
              {{- end }}
              '65535':
                action:
                  deny: {}
          {{- end }}
          vpc-redistribute-connected--{{ $vpc.Name }}:
            rule:
              '10':
                action:
                  permit: {}
                match:
                  ip-prefix-list: vpc-subnets--{{ $vpc.Name }}
                  type: ipv4
          {{- end }}
          lo_to_bgp:
            rule:
              '10':
                action:
                  permit: {}
                description: permit_lo_to_bgp
                match:
                  interface: lo
                  type: ipv4
          w_ecmp_cumulative:
            rule:
              '10':
                action:
                  permit: {}
                description: enable_w_ecmp_adjustment
                set:
                  ext-community-bw: cumulative
          w_ecmp_origin:
            rule:
              '10':
                action:
                  permit: {}
                description: enable_w_ecmp_origination
                set:
                  ext-community-bw: multipaths
      {{- if $.IsSpectrum4 }}
      adaptive-routing:
        state: enabled
        profile: profile-custom
      {{- end }}
      {{- if $.Subnets }}
      vrr:
        state: enabled
      {{- end }}
    vrf:
      default:
        router:
          bgp:
            address-family:
              ipv4-unicast:
                redistribute:
                  connected:
                    route-map: lo_to_bgp
                    state: enabled
                state: enabled
              l2vpn-evpn:
                state: enabled
            peer-group:
              {{- if $.Gateway }}
              gateway:
                address-family:
                  ipv4-unicast:
                    policy:
                      inbound:
                        route-map: gateway-import
                      outbound:
                        route-map: gateway-export
                  l2vpn-evpn:
                    {{- if $.IsLeaf }}
                    policy:
                      inbound:
                        route-map: l2vpn-neighbors
                    {{- end }}
                    state: enabled
                bfd:
                  profile: underlay
                remote-as: {{ $.Gateway.ASN }}
              {{- end }}
              underlay_spine:
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: w_ecmp_origin
                bfd:
                  profile: underlay
                remote-as: external
              underlay_leaf:
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: w_ecmp_cumulative
                bfd:
                  profile: underlay
                remote-as: external
              overlay:
                address-family:
                  ipv4-unicast:
                    state: disabled
                  l2vpn-evpn:
                    {{- if $.IsLeaf }}
                    policy:
                      inbound:
                        route-map: l2vpn-neighbors
                    {{- end }}
                    state: enabled
                bfd:
                  profile: overlay
                multihop-ttl: 2
                remote-as: external
                update-source: lo
            {{- if $.BGPNeighbors }}
            neighbor:
              {{- range $neigh := $.BGPNeighbors }}
              {{ $neigh.IP }}:
                {{- if $neigh.Description }}
                description: {{ $neigh.Description }}
                {{- end }}
                peer-group: {{ $neigh.PeerGroup }}
                type: numbered
              {{- end }}
            {{- end }}
            state: enabled
      {{- range $vpc := $.VPCs }}
      {{ $vpc.VRF }}:
        evpn:
          state: enabled
          vni:
            '{{ $vpc.VNI }}': {}
        router:
          bgp:
            address-family:
              ipv4-unicast:
                redistribute:
                  connected:
                    route-map: vpc-redistribute-connected--{{ $vpc.Name }}
                    state: enabled
                route-export:
                  to-evpn:
                    state: enabled
                {{- if $vpc.ImportVRFs }}
                route-import:
                  from-vrf:
                    list:
                      {{- range $vrf := $vpc.ImportVRFs }}
                      {{ $vrf }}: {}
                      {{- end }}
                    route-map: import-vrf--{{ $vpc.Name }}
                    state: enabled
                {{- end }}
                {{- if $vpc.RouteSumm }}
                aggregate-route:
                  {{- range $route := $vpc.RouteSumm }}
                  {{ $route }}:
                    summary-only: enabled
                  {{- end }}
                {{- end }}
                state: enabled
              l2vpn-evpn:
                state: enabled
            path-selection:
              multipath:
                aspath-ignore: enabled
            rd: {{ $.RouterID }}:{{ $vpc.VNI }}
            state: enabled
          {{- if $vpc.Routes }}
          static:
            {{- range $prefix, $nextHops := $vpc.Routes }}
            {{ $prefix }}:
              via:
                {{- range $nextHop := $nextHops }}
                {{ $nextHop }}: {}
                {{- end }}
            {{- end }}
          {{- end }}
      {{- end }}
      {{- range $ext := $.Externals }}
      {{ $ext.VRF }}:
        evpn:
          state: enabled
          vni:
            '{{ $ext.VNI }}': {}
        router:
          bgp:
            address-family:
              ipv4-unicast:
                {{- if $ext.Static }}
                redistribute:
                  static:
                    route-map: ext-static--{{ $ext.Name }}
                    state: enabled
                {{- end }}
                route-export:
                  to-evpn:
                    route-map: ext-to-evpn
                    state: enabled
                {{- if $ext.ImportPrefixes }}
                route-import:
                  from-vrf:
                    list:
                      {{- range $vrf := $ext.ImportVRFs }}
                      {{ $vrf }}: {}
                      {{- end }}
                    route-map: ext-import--{{ $ext.Name }}
                    state: enabled
                {{- end }}
                state: enabled
              l2vpn-evpn:
                state: enabled
            {{- if $ext.Neighbors }}
            neighbor:
              {{- range $neigh := $ext.Neighbors }}
              {{ $neigh.Key }}:
                address-family:
                  ipv4-unicast:
                    policy:
                      inbound:
                        route-map: ext-inbound--{{ $ext.Name }}
                      outbound:
                        route-map: ext-outbound--{{ $ext.Name }}
                    state: enabled
                {{- if $neigh.BFDProfile }}
                bfd:
                  profile: {{ $neigh.BFDProfile }}
                {{- end }}
                {{- if $neigh.Unnumbered }}
                capabilities:
                  extended-nexthop: enabled
                {{- end }}
                description: {{ $neigh.Description }}
                {{- if $neigh.LocalASN }}
                local-as:
                  asn: {{ $neigh.LocalASN }}
                  prepend: disabled
                  replace: enabled
                  state: enabled
                {{- end }}
                remote-as: {{ $neigh.RemoteAS }}
                type: {{ if $neigh.Unnumbered }}unnumbered{{ else }}numbered{{ end }}
              {{- end }}
            {{- end }}
            rd: {{ $.RouterID }}:{{ $ext.VNI }}
            state: enabled
          {{- if $ext.Routes }}
          static:
            {{- range $prefix, $nextHops := $ext.Routes }}
            {{ $prefix }}:
              via:
                {{- range $nextHop := $nextHops }}
                {{ $nextHop }}: {}
                {{- end }}
            {{- end }}
          {{- end }}
      {{- end }}
    {{- if $.DHCPServer }}
    service:
      dhcp-relay:
        mgmt:
          agent:
            remote-id: cumulus:{{ $.Hostname }}
            state: enabled
          downstream-interface:
            {{- range $subnet := $.Subnets }}
            {{- if $subnet.DHCP }}
            {{ $subnet.Name }}:
              server-group-name: hh
            {{- end }}
            {{- end }}
          gateway-interface:
            eth0:
              address: auto
          server-group:
            hh:
              server:
                {{ $.DHCPServer }}: {}
              upstream-interface:
                eth0: {}
    {{- end }}
    system:
      aaa:
        class:
          nvapply:
            action: allow
            command-path:
              /:
                permission: all
          nvshow:
            action: allow
            command-path:
              /:
                permission: ro
          sudo:
            action: allow
            command-path:
              /:
                permission: all
        role:
          nvue-admin:
            class:
              nvapply: {}
          nvue-monitor:
            class:
              nvshow: {}
          system-admin:
            class:
              nvapply: {}
              sudo: {}
        user:
          {{- range $user := $.Users }}
            {{ $user.Name }}:
              hashed-password: {{ $user.HashedPassword }}
              role: {{ $user.Role }}
              {{- if $user.SSHKeys }}
              ssh:
                authorized-key:
                  {{- range $id, $key := $user.SSHKeys }}
                    key-{{ $id }}:
                      key: {{ $key.Key }}
                      type: {{ $key.Type }}
                  {{- end }}
              {{- end }}
          {{- end }}
      api:
        listening-address:
          127.0.0.1: {}
        state: enabled
      config:
        auto-save:
          state: enabled
        {{- if or $.IsSpectrum4 $.Subnets }}
        snippet:
          {{- if $.IsSpectrum4 }}
          adaptive_routing_conf-snippet:
            file: /etc/cumulus/switchd.d/ar_profile_custom.conf
            content: |
              ar.p.m = 0
              ar.ctl = 400
              ar.ctm = 800
              ar.cth = 2000
              ar.srt = 10
              ar.srf = 10
              ar.p.bit = 0
              ar.p.frt = 4
              ar.p.but = 0
              ar.p.sfe = FALSE
              ar.p.ste = FALSE
              ar.p.ef = FALSE
              ar.ecs = 512
              ar.ibm = ingress
          {{- end }}
          {{- if $.Subnets }}
          ifupdown2_eni:
            {{- range $subnet := $.Subnets }}
            {{ $subnet.Name }}: |
              address-virtual-ipv6-addrgen off
            {{- end }}
          {{- end }}
        {{- end }}
      control-plane:
        acl:
          acl-default-dos:
            inbound: {}
          acl-default-whitelist:
            inbound: {}
      docker:
        vrf: mgmt
      hostname: {{ $.Hostname }}
      lldp:
        state: enabled
        tx-hold-multiplier: 24
        tx-interval: 5
      ntp:
        listen:
          eth0: {}
        server:
          {{ $.NTPServer }}:
            iburst: enabled
        state: enabled
        vrf: mgmt
      ssh-server:
        allow-users:
          {{- range $user := $.Users }}
            {{ $user.Name }}: {}
          {{- end }}
        permit-root-login: disabled
        state: enabled
        vrf:
          mgmt: {}
      wjh:
        channel:
          forwarding:
            trigger:
              l2: {}
              l3: {}
              tunnel: {}
        state: enabled
