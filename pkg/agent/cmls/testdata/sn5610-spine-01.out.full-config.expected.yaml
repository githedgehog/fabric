- set:
    interface:
      eth0:
        ipv6:
          state: disabled
        ipv4:
          address:
            172.30.0.7/21: {}
        type: eth
        vrf: mgmt
      lo:
        ipv4:
          address:
            172.30.8.0/32: {}
            
        type: loopback
      swp1-64:
        ipv6:
          state: disabled
        lldp:
          state: enabled
        qos:
          pfc-watchdog:
            state: enable
      
      
      swp1s0:
        link:
          state:
            up: {}
        
        
        ipv4:
          address:
            172.30.128.0/31: {}
        
        
        router:
          adaptive-routing:
            state: enabled
        
      
      swp2:
        link:
          state:
            up: {}
        
        
        ipv4:
          address:
            172.30.128.2/31: {}
        
        
        router:
          adaptive-routing:
            state: enabled
        
      
      swp3:
        link:
          state:
            up: {}
        
        
        ipv4:
          address:
            172.30.128.4/31: {}
        
        
        router:
          adaptive-routing:
            state: enabled
        
      
      swp4:
        link:
          state:
            up: {}
        
        
        ipv4:
          address:
            172.30.128.6/31: {}
        
        
        router:
          adaptive-routing:
            state: enabled
        
      
      
    evpn:
      state: enabled
    
    qos:
      pfc:
        default-global:
          port-buffer: 363000
          switch-priority:
            '3': {}
          xoff-threshold: 75000
          xon-threshold: 75000
      roce:
        mode: lossless
        state: enabled
      traffic-pool:
        default-lossy:
          memory-percent: 10
        roce-lossless:
          memory-percent: 90
    router:
      bfd:
        profile:
          overlay:
            detect-multiplier: 3
            min-rx-interval: 1000
            min-tx-interval: 1000
          underlay:
            detect-multiplier: 3
            min-rx-interval: 300
            min-tx-interval: 300
        state: enabled
      bgp:
        autonomous-system: 65100
        router-id: 172.30.8.0
        graceful-restart:
          mode: full
          path-selection-deferral-time: 180
          restart-time: 180
          stale-routes-time: 180
        state: enabled
      policy:
        prefix-list:
          host_subnets:
            rule:
              '10':
                action: permit
                match:
                  10.0.0.0/8:
                    max-prefix-len: 31
            type: ipv4
        route-map:
          host_subnets:
            rule:
              '10':
                action:
                  permit: {}
                description: permit_host_subnets
                match:
                  ip-prefix-list: host_subnets
                  type: ipv4
          lo_to_bgp:
            rule:
              '10':
                action:
                  permit: {}
                description: permit_lo_to_bgp
                match:
                  interface: lo
                  type: ipv4
          w_ecmp_cumulative:
            rule:
              '10':
                action:
                  permit: {}
                description: enable_w_ecmp_adjustment
                set:
                  ext-community-bw: cumulative
          w_ecmp_origin:
            rule:
              '10':
                action:
                  permit: {}
                description: enable_w_ecmp_origination
                set:
                  ext-community-bw: multipaths
      adaptive-routing:
        state: enabled
        profile: profile-custom
    vrf:
      default:
        router:
          bgp:
            address-family:
              ipv4-unicast:
                redistribute:
                  connected:
                    route-map: lo_to_bgp
                    state: enabled
                state: enabled
              l2vpn-evpn:
                state: enabled
            peer-group:
              underlay_spine:
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: w_ecmp_origin
                bfd:
                  profile: underlay
                remote-as: external
              underlay_leaf:
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: w_ecmp_cumulative
                bfd:
                  profile: underlay
                remote-as: external
              overlay:
                address-family:
                  ipv4-unicast:
                    state: disabled
                  l2vpn-evpn:
                    state: enabled
                bfd:
                  profile: overlay
                multihop-ttl: 2
                remote-as: external
                update-source: lo
            
            neighbor:
              
              172.30.128.1:
                description: fabric underlay to leaf leaf-01/E1/5
                peer-group: underlay_leaf
                type: numbered
              
              172.30.128.3:
                description: fabric underlay to leaf leaf-01/E1/6
                peer-group: underlay_leaf
                type: numbered
              
              172.30.128.5:
                description: fabric underlay to leaf leaf-02/E1/4
                peer-group: underlay_leaf
                type: numbered
              
              172.30.128.7:
                description: fabric underlay to leaf leaf-02/E1/5
                peer-group: underlay_leaf
                type: numbered
              
              172.30.8.2:
                description: fabric overlay to leaf leaf-01
                peer-group: overlay
                type: numbered
              
              172.30.8.3:
                description: fabric overlay to leaf leaf-02
                peer-group: overlay
                type: numbered
              
            
            state: enabled
      
    system:
      aaa:
        class:
          nvapply:
            action: allow
            command-path:
              /:
                permission: all
          nvshow:
            action: allow
            command-path:
              /:
                permission: ro
          sudo:
            action: allow
            command-path:
              /:
                permission: all
        role:
          nvue-admin:
            class:
              nvapply: {}
          nvue-monitor:
            class:
              nvshow: {}
          system-admin:
            class:
              nvapply: {}
              sudo: {}
        user:
          
            admin:
              hashed-password: $5$8nAYPGcl4l6G7Av1$Qi4/gnM0yPtGv9kjpMh78NuNSfQWy7vR1rulHpurL36
              role: system-admin
              ssh:
                authorized-key:
                  
                    key-0:
                      key: AAAAC3NzaC1lZDI1NTE5AAAAIGpF2+9I1Nj4BcN7y6DjzTbq1VcUYIRGyfzId5ZoBEFj
                      type: ssh-ed25519
                  
                    key-1:
                      key: AAAAC3NzaC1lZDI1NTE5AAAAIILr33oUspqfHiKC9BaenkKG3nIznbi/Ep3mmsMZjS4U
                      type: ssh-ed25519
                  
          
            op:
              hashed-password: $5$8nAYPGcl4l6G7Av1$Qi4/gnM0yPtGv9kjpMh78NuNSfQWy7vR1rulHpurL36
              role: nvue-monitor
              ssh:
                authorized-key:
                  
                    key-0:
                      key: AAAAC3NzaC1lZDI1NTE5AAAAIGpF2+9I1Nj4BcN7y6DjzTbq1VcUYIRGyfzId5ZoBEFj
                      type: ssh-ed25519
                  
                    key-1:
                      key: AAAAC3NzaC1lZDI1NTE5AAAAIILr33oUspqfHiKC9BaenkKG3nIznbi/Ep3mmsMZjS4U
                      type: ssh-ed25519
                  
          
      api:
        state: enabled
      config:
        auto-save:
          state: enabled
        snippet:
          adaptive_routing_conf-snippet:
            file: /etc/cumulus/switchd.d/ar_profile_custom.conf
            content: |
              ar.p.m = 0
              ar.ctl = 400
              ar.ctm = 800
              ar.cth = 2000
              ar.srt = 10
              ar.srf = 10
              ar.p.bit = 0
              ar.p.frt = 4
              ar.p.but = 0
              ar.p.sfe = FALSE
              ar.p.ste = FALSE
              ar.p.ef = FALSE
              ar.ecs = 512
              ar.ibm = ingress
      control-plane:
        acl:
          acl-default-dos:
            inbound: {}
          acl-default-whitelist:
            inbound: {}
      docker:
        vrf: mgmt
      hostname: spine-01
      lldp:
        state: enabled
        tx-hold-multiplier: 24
        tx-interval: 5
      ntp:
        listen:
          eth0: {}
        server:
          172.30.0.1:
            iburst: enabled
        state: enabled
        vrf: mgmt
      ssh-server:
        allow-users:
          
            admin: {}
          
            op: {}
          
        permit-root-login: disabled
        state: enabled
      wjh:
        channel:
          forwarding:
            trigger:
              l2: {}
              l3: {}
              tunnel: {}
        state: enabled
