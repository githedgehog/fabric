    evpn:
      state: enabled
    qos:
      pfc:
        default-global:
          port-buffer: 363000
          switch-priority:
            '3': {}
          xoff-threshold: 75000
          xon-threshold: 75000
      roce:
        mode: lossless
        state: enabled
      traffic-pool:
        default-lossy:
          memory-percent: 10
        roce-lossless:
          memory-percent: 90
    router:
      bfd:
        profile:
          overlay:
            detect-multiplier: 3
            min-rx-interval: 1000
            min-tx-interval: 1000
          underlay:
            detect-multiplier: 3
            min-rx-interval: 300
            min-tx-interval: 300
        state: enabled
      bgp:
        autonomous-system: 65100
        router-id: 172.30.8.0
        graceful-restart:
          mode: full
          path-selection-deferral-time: 180
          restart-time: 180
          stale-routes-time: 180
        state: enabled
      policy:
        prefix-list:
          host_subnets:
            rule:
              '10':
                action: permit
                match:
                  10.0.0.0/8:
                    max-prefix-len: 31
            type: ipv4
        route-map:
          host_subnets:
            rule:
              '10':
                action:
                  permit: {}
                description: permit_host_subnets
                match:
                  ip-prefix-list: host_subnets
                  type: ipv4
          lo_to_bgp:
            rule:
              '10':
                action:
                  permit: {}
                description: permit_lo_to_bgp
                match:
                  interface: lo
                  type: ipv4
          w_ecmp_cumulative:
            rule:
              '10':
                action:
                  permit: {}
                description: enable_w_ecmp_adjustment
                set:
                  ext-community-bw: cumulative
          w_ecmp_origin:
            rule:
              '10':
                action:
                  permit: {}
                description: enable_w_ecmp_origination
                set:
                  ext-community-bw: multipaths
      adaptive-routing:
        state: enabled
        profile: profile-custom
    vrf:
      default:
        router:
          bgp:
            address-family:
              ipv4-unicast:
                redistribute:
                  connected:
                    route-map: lo_to_bgp
                    state: enabled
                state: enabled
              l2vpn-evpn:
                state: enabled
            peer-group:
              underlay_spine:
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: w_ecmp_origin
                bfd:
                  profile: underlay
                remote-as: external
              underlay_leaf:
                address-family:
                  ipv4-unicast:
                    policy:
                      outbound:
                        route-map: w_ecmp_cumulative
                bfd:
                  profile: underlay
                remote-as: external
              overlay:
                address-family:
                  ipv4-unicast:
                    state: disabled
                  l2vpn-evpn:
                    state: enabled
                bfd:
                  profile: overlay
                multihop-ttl: 2
                remote-as: external
                update-source: lo
            neighbor:
              172.30.128.1:
                description: fabric underlay to leaf leaf-01/E1/5
                peer-group: underlay_leaf
                type: numbered
              172.30.128.3:
                description: fabric underlay to leaf leaf-01/E1/6
                peer-group: underlay_leaf
                type: numbered
              172.30.128.5:
                description: fabric underlay to leaf leaf-02/E1/4
                peer-group: underlay_leaf
                type: numbered
              172.30.128.7:
                description: fabric underlay to leaf leaf-02/E1/5
                peer-group: underlay_leaf
                type: numbered
              172.30.8.2:
                description: fabric overlay to leaf leaf-01
                peer-group: overlay
                type: numbered
              172.30.8.3:
                description: fabric overlay to leaf leaf-02
                peer-group: overlay
                type: numbered
            state: enabled
    system:
      aaa:
        class:
          nvapply:
            action: allow
            command-path:
